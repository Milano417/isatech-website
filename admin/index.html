<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration | ISATech</title>
  <link rel="icon" href="../assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Connexion / première configuration -->
  <section class="auth" id="auth" hidden>
    <form class="auth-card" id="auth-form">
      <img src="../assets/images/logo.jpg" alt="ISATech" width="64" height="64">
      <h1 id="auth-title">Espace administration</h1>
      <p id="auth-help">Connectez-vous pour gérer le contenu du site.</p>
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" name="password" id="auth-password" required minlength="8" autocomplete="current-password">
      </label>
      <label class="field" id="auth-confirm-wrap" hidden>
        <span>Confirmer le mot de passe</span>
        <input type="password" name="confirm" autocomplete="new-password">
      </label>
      <div class="form-error" id="auth-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Se connecter</button>
      <a class="back-link" href="../index.html">← Retour au site</a>
    </form>
  </section>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <a class="brand" href="../index.html" target="_blank" rel="noopener" title="Voir le site">
        <img src="../assets/images/logo.jpg" alt="" width="40" height="40">
        <span><strong>ISATech</strong><small>Administration</small></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Sections de l'administration">
        <button type="button" data-tab="dashboard">Tableau de bord</button>
        <button type="button" data-tab="gallery">Galerie photos</button>
        <button type="button" data-tab="formations">Formations</button>
        <button type="button" data-tab="news">Actualités</button>
        <button type="button" data-tab="infos">Infos & communiqués</button>
        <button type="button" data-tab="settings">Options du site</button>
        <button type="button" data-tab="messages">Messages <span class="count" id="unread-count" hidden></span></button>
        <button type="button" data-tab="security">Sécurité</button>
      </nav>
      <div class="sidebar-foot">
        <a class="btn btn-light btn-block" href="../index.html" target="_blank" rel="noopener">Voir le site ↗</a>
        <button class="btn btn-ghost btn-block" type="button" id="logout">Se déconnecter</button>
      </div>
    </aside>

    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <!-- Fenêtre d'édition -->
  <dialog class="modal" id="editor">
    <form method="dialog" class="modal-inner" id="editor-form" novalidate>
      <header class="modal-head">
        <h2 id="editor-title">Modifier</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fermer">×</button>
      </header>
      <div class="modal-body" id="editor-body"></div>
      <footer class="modal-foot">
        <div class="form-error" id="editor-error" role="alert"></div>
        <button class="btn btn-ghost" type="button" data-close>Annuler</button>
        <button class="btn btn-primary" type="submit" id="editor-save">Enregistrer</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
